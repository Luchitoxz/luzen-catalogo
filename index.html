<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUZEN | Catálogo Oficial de Camisetas de Fútbol</title>
  <meta name="description" content="Catálogo de camisetas de fútbol de selecciones, clubes europeos, clubes argentinos y modelos retro en LUZEN.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/luzen_logo_transparent.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#0A0A0C',
              card: '#F5F5F7',
              border: '#E5E7EB'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-white text-zinc-950 font-sans selection:bg-black selection:text-white antialiased min-h-screen flex flex-col">

  <!-- ============================================================ -->
  <!-- 1. HEADER / NAVBAR                                           -->
  <!-- ============================================================ -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-zinc-100 transition-all duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- LUZEN Logo -->
      <a href="#" class="flex items-center gap-1 group shrink-0" aria-label="LUZEN Inicio">
        <img 
          src="assets/images/luzen_logo_transparent.png" 
          alt="LUZEN" 
          class="h-9 sm:h-11 w-auto object-contain transition-transform duration-200 group-hover:opacity-85"
        />
      </a>

      <!-- Right Header Actions: Search Toggle & Cart with Counter -->
      <div class="flex items-center gap-2 sm:gap-4">
        
        <!-- Search icon button (focuses search input) -->
        <button 
          onclick="document.getElementById('search-input')?.focus();"
          aria-label="Buscar"
          class="w-10 h-10 rounded-full flex items-center justify-center text-zinc-800 hover:bg-zinc-100 transition"
          title="Buscar camisetas">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>

        <!-- Cart button with counter badge -->
        <button 
          aria-label="Carrito de compras"
          class="open-cart-btn relative w-10 h-10 rounded-full flex items-center justify-center text-zinc-900 hover:bg-zinc-100 transition"
          title="Ver carrito">
          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
          <!-- Counter Badge (shows 0 initially, matching mockup) -->
          <span 
            id="cart-badge" 
            class="absolute top-1 right-1 bg-black text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center leading-none">
            0
          </span>
        </button>

      </div>

    </div>
  </header>


  <!-- ============================================================ -->
  <!-- 2. CATALOG CONTROLS (CATEGORY PILLS + SEARCH BAR)            -->
  <!-- ============================================================ -->
  <section class="py-3 sm:py-4 border-b border-zinc-100 bg-white sticky top-20 z-30 bg-white/95 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 space-y-3 md:space-y-0 md:flex md:items-center md:justify-between md:gap-4">
      
      <!-- Category Pills: Única fila horizontal con deslizamiento de izquierda a derecha -->
      <div class="relative w-full md:w-auto overflow-hidden">
        <div 
          id="category-pills-container" 
          class="flex flex-nowrap items-center gap-2 overflow-x-auto py-1 scrollbar-none"
          style="-webkit-overflow-scrolling: touch;">
          <!-- Injected dynamically via app.js (Todos, Selecciones, Clubes Europeos, Clubes Argentinos, Retro, Nuevos) -->
        </div>
      </div>

      <!-- Right: Search Input matching mockup -->
      <div class="relative w-full md:w-72 shrink-0">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar remera..." 
          class="w-full bg-white border border-zinc-200 rounded-full pl-10 pr-4 py-2 text-xs md:text-sm text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-2 focus:ring-black/10 focus:border-black transition"
        >
      </div>

    </div>
  </section>


  <!-- ============================================================ -->
  <!-- 3. CATALOG CONTENT AREA                                      -->
  <!-- ============================================================ -->
  <main class="flex-1 max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-4 sm:py-8 w-full">
    <!-- Grid container: en celular es una única fila con deslizamiento horizontal de izquierda a derecha -->
    <div id="catalog-grid" class="w-full">
      <!-- Injected via app.js -->
    </div>
  </main>


  <!-- ============================================================ -->
  <!-- 4. SLIDE-OVER CART DRAWER                                    -->
  <!-- ============================================================ -->
  <div id="cart-overlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 transition-opacity"></div>
  <aside 
    id="cart-drawer" 
    class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-50 translate-x-full transition-transform duration-300 ease-in-out flex flex-col"
    aria-label="Carrito de Compras">
    
    <!-- Drawer Header -->
    <div class="p-5 border-b border-zinc-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="shopping-cart" class="w-5 h-5 text-black"></i>
        <h3 class="font-extrabold text-base text-zinc-950">Tu Carrito</h3>
      </div>
      <button id="close-cart-btn" class="w-8 h-8 rounded-full hover:bg-zinc-100 flex items-center justify-center text-zinc-500 hover:text-black transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Free shipping notification -->
    <div class="bg-zinc-50 px-5 py-2.5 border-b border-zinc-100 text-xs text-zinc-700 flex items-center gap-2">
      <i data-lucide="truck" class="w-4 h-4 text-emerald-600"></i>
      <span>Envío asegurado a todo el país</span>
    </div>

    <!-- Cart items container -->
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-5 space-y-3">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Drawer Footer -->
    <div class="p-5 border-t border-zinc-100 bg-zinc-50/50 space-y-4">
      <div class="space-y-1.5 text-xs text-zinc-600">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span id="cart-subtotal" class="font-semibold text-zinc-900">$ 0</span>
        </div>
        <div class="flex justify-between">
          <span>Envío</span>
          <span class="font-bold text-emerald-600">A coordinar</span>
        </div>
        <div class="flex justify-between text-base font-black text-zinc-950 pt-2 border-t border-zinc-200">
          <span>Total</span>
          <span id="cart-total">$ 0</span>
        </div>
      </div>

      <button 
        id="cart-checkout-btn" 
        class="w-full bg-[#0A0A0C] hover:bg-zinc-800 text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 text-sm transition-all shadow-md active:scale-[0.98]">
        <i data-lucide="message-circle" class="w-4 h-4 text-emerald-400"></i>
        <span>Finalizar compra por WhatsApp</span>
      </button>
    </div>
  </aside>


  <!-- ============================================================ -->
  <!-- 5. FLOATING TOAST NOTIFICATION CONTAINER                     -->
  <!-- ============================================================ -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main JavaScript application -->
  <script src="assets/js/app.js"></script>
</body>
</html>
